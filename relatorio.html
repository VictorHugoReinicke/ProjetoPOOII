<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .chart-container {
            margin-bottom: 40px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .chart-title {
            color: #666;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width {
            grid-column: span 2;
        }
    </style>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['corechart', 'table']});
      google.charts.setOnLoadCallback(drawCharts);

      function formatMoney(value) {
          if (value === null || value === undefined) return 'R$ 0,00';
          return 'R$ ' + value.toFixed(2).replace('.', ',');
      }

      function drawCharts() {
    var dataTable = new google.visualization.DataTable();
    dataTable.addColumn('string', 'Tipo DDR');
    dataTable.addColumn('number', 'Média (R$)');
    dataTable.addColumn('number', 'Mediana (R$)');
    dataTable.addColumn('number', 'Moda (R$)');
    dataTable.addColumn('number', 'Desvio Padrão (R$)');
    dataTable.addColumn('number', 'Variância (R$)');
    dataTable.addColumn('number', 'Quantidade');
dataTable.addRow(['DDR3', 0, 0, 0, 0, 0, 0]);dataTable.addRow(['DDR4', 657.21, 657.21, 657.21, 0.00, 0.00, 1]);dataTable.addRow(['DDR5', 0, 0, 0, 0, 0, 0]);    var table = new google.visualization.Table(document.getElementById('table_stats'));

    var formatter = new google.visualization.NumberFormat({
        pattern: 'R$ ###,##0.00'
    });
    formatter.format(dataTable, 1); // Formatar coluna Média
    formatter.format(dataTable, 2); // Formatar coluna Mediana
    formatter.format(dataTable, 3); // Formatar coluna Moda
    formatter.format(dataTable, 4); // Formatar coluna Desvio Padrão
    formatter.format(dataTable, 5); // Formatar coluna Variância

    table.draw(dataTable, {
        showRowNumber: true,
        width: '100%',
        height: '100%',
        alternatingRowStyle: true,
        page: 'enable',
        pageSize: 10
    });
var dataMarca = google.visualization.arrayToDataTable([['Marca', 'Média (R$)', {type: 'string', role: 'tooltip', p: {html: true}}, { role: 'annotation' } ],['HyperX', 657.21, '<div style=\"padding:10px; font-size:12px;\"><b>HyperX</b><br/><b>Média: R$ 657.21</b><br/>Mediana: R$ 657.21<br/>Moda: R$ 657.21<br/>Desvio Padrão: R$ 0.00<br/>Variância: R$ 0.00<br/>Quantidade: 1 produtos</div>', 657.21]]);    var chartMarca = new google.visualization.ColumnChart(document.getElementById('graficoMarca'));
    chartMarca.draw(dataMarca, {
        title: 'Média de Preço por Marca',
        legend: { position: 'none' },
        vAxis: {
            format: 'R$ ###,##0.00',
            title: 'Preço (R$)'
        },
        tooltip: { isHtml: true }
    });
var dataPizza = google.visualization.arrayToDataTable([['Marca', 'Quantidade'],['HyperX', 1]]);    var chartPizza = new google.visualization.PieChart(document.getElementById('graficoPizza'));
    chartPizza.draw(dataPizza, {
        title: 'Distribuição de Produtos por Marca',
        legend: { position: 'labeled' },
        sliceVisibilityThreshold: 0.05,
        pieSliceText: 'value',
        pieSliceTextStyle: { fontSize: 12 }
    });
var data_graficoMax = google.visualization.arrayToDataTable([['Tipo DDR', 'PC', 'Notebook'],['DDR3', 0.00, 0.00],['DDR4', 657.21, 0.00],['DDR5', 0.00, 0.00]]);var chart_graficoMax = new google.visualization.ColumnChart(document.getElementById('graficoMax'));chart_graficoMax.draw(data_graficoMax, {title: 'Preço Máximo por Tipo DDR e Categoria',legend: { position: 'top' },vAxis: {    format: 'R$ ###,##0.00',   title: 'Preço (R$)'},hAxis: { title: 'Tipo DDR' }});var data_graficoMin = google.visualization.arrayToDataTable([['Tipo DDR', 'PC', 'Notebook'],['DDR3', 0.00, 0.00],['DDR4', 657.21, 0.00],['DDR5', 0.00, 0.00]]);var chart_graficoMin = new google.visualization.ColumnChart(document.getElementById('graficoMin'));chart_graficoMin.draw(data_graficoMin, {title: 'Preço Mínimo por Tipo DDR e Categoria',legend: { position: 'top' },vAxis: {    format: 'R$ ###,##0.00',   title: 'Preço (R$)'},hAxis: { title: 'Tipo DDR' }});      }
    </script>
</head>
<body>
    <div class="container">
        <h1>Relatório de Análise de Memórias RAM</h1>

        <div class="chart-container">
            <div class="chart-title">Estatísticas por Tipo de DDR</div>
            <div id="table_stats" style="width:100%; height:300px;"></div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">Média de Preço por Marca</div>
                <div id="graficoMarca" style="width:100%; height:400px;"></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Distribuição por Marca</div>
                <div id="graficoPizza" style="width:100%; height:400px;"></div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">Preço Máximo por DDR e Categoria</div>
                <div id="graficoMax" style="width:100%; height:400px;"></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Preço Mínimo por DDR e Categoria</div>
                <div id="graficoMin" style="width:100%; height:400px;"></div>
            </div>
        </div>
    </div>
</body>
</html>
