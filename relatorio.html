<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        .chart-container {
            margin-bottom: 40px;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
        }
        .chart-title {
            color: #666;
            margin-bottom: 15px;
            font-size: 1.2em;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .full-width {
            grid-column: span 2;
        }
    </style>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
      google.charts.load('current', {'packages':['corechart', 'table']});
      google.charts.setOnLoadCallback(drawCharts);

      function formatMoney(value) {
          if (value === null || value === undefined) return 'R$ 0,00';
          return 'R$ ' + value.toFixed(2).replace('.', ',');
      }

      function drawCharts() {
    var dataTable = new google.visualization.DataTable();
    dataTable.addColumn('string', 'Tipo DDR');
    dataTable.addColumn('number', 'Média (R$)');
    dataTable.addColumn('number', 'Mediana (R$)');
    dataTable.addColumn('number', 'Moda (R$)');
    dataTable.addColumn('number', 'Desvio Padrão (R$)');
    dataTable.addColumn('number', 'Variância (R$)');
    dataTable.addColumn('number', 'Quantidade');
dataTable.addRow(['DDR3', 510.84, 405.84, 192.59, 318.05, 101157.14, 27]);dataTable.addRow(['DDR4', 606.80, 647.18, 308.97, 267.12, 71352.70, 38]);dataTable.addRow(['DDR5', 581.96, 589.04, 678.92, 239.87, 57539.76, 35]);    var table = new google.visualization.Table(document.getElementById('table_stats'));

    var formatter = new google.visualization.NumberFormat({
        pattern: 'R$ ###,##0.00'
    });
    formatter.format(dataTable, 1); // Formatar coluna Média
    formatter.format(dataTable, 2); // Formatar coluna Mediana
    formatter.format(dataTable, 3); // Formatar coluna Moda
    formatter.format(dataTable, 4); // Formatar coluna Desvio Padrão
    formatter.format(dataTable, 5); // Formatar coluna Variância

    table.draw(dataTable, {
        showRowNumber: true,
        width: '100%',
        height: '100%',
        alternatingRowStyle: true,
        page: 'enable',
        pageSize: 10
    });
var dataMarca = google.visualization.arrayToDataTable([['Marca', 'Média (R$)', {type: 'string', role: 'tooltip', p: {html: true}}, { role: 'annotation' } ],['HyperX', 525.00, '<div style=\"padding:10px; font-size:12px;\"><b>HyperX</b><br/><b>Média: R$ 525.00</b><br/>Mediana: R$ 445.63<br/>Moda: R$ 381.23<br/>Desvio Padrão: R$ 267.48<br/>Variância: R$ 71544.07<br/>Quantidade: 14 produtos</div>', 525.00],['ADATA', 409.67, '<div style=\"padding:10px; font-size:12px;\"><b>ADATA</b><br/><b>Média: R$ 409.67</b><br/>Mediana: R$ 461.37<br/>Moda: R$ 452.05<br/>Desvio Padrão: R$ 208.29<br/>Variância: R$ 43386.48<br/>Quantidade: 14 produtos</div>', 409.67],['Kingston', 534.51, '<div style=\"padding:10px; font-size:12px;\"><b>Kingston</b><br/><b>Média: R$ 534.51</b><br/>Mediana: R$ 415.11<br/>Moda: R$ 308.97<br/>Desvio Padrão: R$ 291.98<br/>Variância: R$ 85251.55<br/>Quantidade: 26 produtos</div>', 534.51],['Corsair', 610.64, '<div style=\"padding:10px; font-size:12px;\"><b>Corsair</b><br/><b>Média: R$ 610.64</b><br/>Mediana: R$ 589.04<br/>Moda: R$ 192.59<br/>Desvio Padrão: R$ 265.02<br/>Variância: R$ 70237.11<br/>Quantidade: 13 produtos</div>', 610.64],['Samsung', 653.10, '<div style=\"padding:10px; font-size:12px;\"><b>Samsung</b><br/><b>Média: R$ 653.10</b><br/>Mediana: R$ 762.35<br/>Moda: R$ 678.92<br/>Desvio Padrão: R$ 276.14<br/>Variância: R$ 76252.88<br/>Quantidade: 14 produtos</div>', 653.10],['Crucial', 692.40, '<div style=\"padding:10px; font-size:12px;\"><b>Crucial</b><br/><b>Média: R$ 692.40</b><br/>Mediana: R$ 777.11<br/>Moda: R$ 928.07<br/>Desvio Padrão: R$ 246.55<br/>Variância: R$ 60785.39<br/>Quantidade: 19 produtos</div>', 692.40]]);    var chartMarca = new google.visualization.ColumnChart(document.getElementById('graficoMarca'));
    chartMarca.draw(dataMarca, {
        title: 'Média de Preço por Marca',
        legend: { position: 'none' },
        vAxis: {
            format: 'R$ ###,##0.00',
            title: 'Preço (R$)'
        },
        tooltip: { isHtml: true }
    });
var dataPizza = google.visualization.arrayToDataTable([['Marca', 'Quantidade'],['HyperX', 14],['ADATA', 14],['Kingston', 26],['Corsair', 13],['Samsung', 14],['Crucial', 19]]);    var chartPizza = new google.visualization.PieChart(document.getElementById('graficoPizza'));
    chartPizza.draw(dataPizza, {
        title: 'Distribuição de Produtos por Marca',
        legend: { position: 'labeled' },
        sliceVisibilityThreshold: 0.05,
        pieSliceText: 'value',
        pieSliceTextStyle: { fontSize: 12 }
    });
var data_graficoMax = google.visualization.arrayToDataTable([['Tipo DDR', 'PC', 'Notebook'],['DDR3', 998.48, 990.72],['DDR4', 941.84, 989.49],['DDR5', 867.13, 972.56]]);var chart_graficoMax = new google.visualization.ColumnChart(document.getElementById('graficoMax'));chart_graficoMax.draw(data_graficoMax, {title: 'Preço Máximo por Tipo DDR e Categoria',legend: { position: 'top' },vAxis: {    format: 'R$ ###,##0.00',   title: 'Preço (R$)'},hAxis: { title: 'Tipo DDR' }});var data_graficoMin = google.visualization.arrayToDataTable([['Tipo DDR', 'PC', 'Notebook'],['DDR3', 156.72, 135.07],['DDR4', 143.36, 150.21],['DDR5', 217.39, 147.42]]);var chart_graficoMin = new google.visualization.ColumnChart(document.getElementById('graficoMin'));chart_graficoMin.draw(data_graficoMin, {title: 'Preço Mínimo por Tipo DDR e Categoria',legend: { position: 'top' },vAxis: {    format: 'R$ ###,##0.00',   title: 'Preço (R$)'},hAxis: { title: 'Tipo DDR' }});      }
    </script>
</head>
<body>
    <div class="container">
        <h1>Relatório de Análise de Memórias RAM</h1>

        <div class="chart-container">
            <div class="chart-title">Estatísticas por Tipo de DDR</div>
            <div id="table_stats" style="width:100%; height:300px;"></div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">Média de Preço por Marca</div>
                <div id="graficoMarca" style="width:100%; height:400px;"></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Distribuição por Marca</div>
                <div id="graficoPizza" style="width:100%; height:400px;"></div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title">Preço Máximo por DDR e Categoria</div>
                <div id="graficoMax" style="width:100%; height:400px;"></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Preço Mínimo por DDR e Categoria</div>
                <div id="graficoMin" style="width:100%; height:400px;"></div>
            </div>
        </div>
    </div>
</body>
</html>
